<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>she11</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="cjs/style.css">
</head>
<body>
    <div class="background"></div>
    <div class="particles" id="particles"></div>

    <div id="loading">
        <div>
            <span class="loading-nick" id="loading-typed"></span><span class="loading-cursor">|</span>
        </div>
    </div>

    <div class="card">
        <img src="i/pfp.jpg" alt="avatar" class="avatar">
        <h1 class="username"><span id="typed-name"></span><span class="cursor">|</span></h1>
        <div class="bio" id="typed-bio"></div>
        <div class="links">
            <a href="https://vk.ru/wittylunar" target="_blank" title="VK">
                <i class="fab fa-vk"></i>
            </a>
            <a href="https://github.com/lunarshe11" target="_blank" title="GitHub">
                <i class="fab fa-github"></i>
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="cjs/script.js"></script>
</body>
